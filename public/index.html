<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c1830">
<title>Momo Dev Story</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Momo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; overscroll-behavior: none; touch-action: manipulation; background: #2c1830; color: #fcefdc; font-family: system-ui, sans-serif; }
  /* EmulatorJS anchors its gamepad to the bottom of the player, so the page
     must reach the real bottom of the screen (see fitScreen below) */
  body { display: flex; flex-direction: column; position: fixed; top: 0; left: 0; right: 0; height: 100%; }
  /* EmulatorJS's Start button sits near the player bottom; keep it clear of
     the iPhone home-bar gesture area (env() is the phone's own inset) */
  #game .ejs_start_button { bottom: calc(95px + env(safe-area-inset-bottom)) !important; }
  /* gamepad: EmulatorJS's 50px lift, trimmed to just clear the home bar */
  #game .ejs_virtualGamepad_parent { bottom: max(24px, calc(env(safe-area-inset-bottom) + 6px)) !important; }
  #debug { position: fixed; left: 4px; bottom: 4px; z-index: 99; font: 11px monospace; background: #000b; padding: 4px; white-space: pre; pointer-events: none; }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); }
  header h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ver { font-size: 10px; opacity: .5; font-weight: 400; }
  #cheat { background: #f58c28; color: #3c241e; border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 13px; }
  #cheat:active { transform: scale(0.96); }
  #cheat:disabled { opacity: 0.5; }
  #fs { background: none; color: #fcefdc; border: 1px solid #fcefdc66; border-radius: 8px; padding: 4px 9px; font-size: 16px; }
  #game-wrap { flex: 1; min-height: 0; position: relative; }
  #game { width: 100%; height: 100%; }
  #keys { font-size: 12px; opacity: .75; text-align: center; padding: 4px 8px; padding-bottom: max(4px, env(safe-area-inset-bottom)); }
  @media (pointer: coarse) { #keys { display: none; } }  /* phones get the on-screen gamepad */
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #000c; padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🐱 Momo Dev Story <small id="ver">v0</small></h1>
  <button id="fs" title="Full screen">⛶</button>
  <button id="cheat" title="Secret code: ↑↑↓↓←→←→BA (shortcut: ` key)">↑↑↓↓←→←→BA</button>
</header>
<div id="game-wrap"><div id="game"></div></div>
<div id="keys">Keys: ←↑↓→ D-pad · Z = A · X = B · A = X · S = Y · Enter = START · Shift = SELECT · Q/W = L/R · ` = secret code</div>
<div id="toast"></div>
<script>
  window.EJS_player = "#game";
  window.EJS_core = "nds";
  window.EJS_gameUrl = "momo_dev_story.nds";
  window.EJS_gameName = "Momo Dev Story";
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_color = "#f58c28";
  window.EJS_backgroundColor = "#2c1830";
  // English UI: auto-detecting the phone's language fetches a translation that
  // sometimes fails and leaves "undefined" labels
  window.EJS_language = "en-US";
  window.EJS_disableAutoLang = true;

  // iPhone / iPad Safari: emulating the DS in WebAssembly keeps the CPU busy;
  // when it falls behind, EmulatorJS's short 64 ms audio buffer runs dry and
  // the gaps sound like crackling (it isn't clipping: lower volume doesn't help).
  // On iOS we use a bigger buffer and RetroArch's cheaper "cc" resampler
  // (the default "sinc" one costs a lot of CPU). Everything can be overridden
  // in the URL for testing, e.g.  ?latency=320&resampler=nearest&core=desmume
  //   latency:   audio buffer in ms (EmulatorJS default 64)
  //   resampler: sinc | cc | nearest
  //   core:      melonds (default) | desmume | desmume2015
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                 (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const qs = new URLSearchParams(location.search);
  const AUDIO_LATENCY = qs.get("latency") || (IS_IOS ? "256" : null);
  const AUDIO_RESAMPLER = qs.get("resampler") || (IS_IOS ? "cc" : null);
  const CORE = qs.get("core");
  if (CORE)
    window.EJS_core = CORE;
  if (AUDIO_LATENCY || AUDIO_RESAMPLER) {
    // patch EmulatorJS's RetroArch config as soon as its code has loaded
    // (before the player taps start, which is when the config is written)
    let patched = false;
    const patchAudio = () => {
      if (patched || typeof EJS_GameManager === "undefined") return patched;
      const gmProto = EJS_GameManager.prototype;
      const cfg = gmProto.getRetroArchCfg;
      gmProto.getRetroArchCfg = function () {
        let c = cfg.call(this);
        if (AUDIO_LATENCY)
          c = c.replace(/audio_latency = \d+/, "audio_latency = " + parseInt(AUDIO_LATENCY, 10));
        if (AUDIO_RESAMPLER)
          c += 'audio_resampler = "' + AUDIO_RESAMPLER + '"\naudio_resampler_quality = "1"\n';
        return c;
      };
      patched = true;
      return true;
    };
    const iv = setInterval(() => { if (patchAudio()) clearInterval(iv); }, 50);
    window.EJS_ready = patchAudio;
  }
  // no auto-start: iOS (especially home-screen apps) needs a tap before the
  // emulator can start its audio
  // fixed keyboard layout (matches the legend below the game)
  window.EJS_defaultControls = {
    0: {
      0: { value: "x" }, 1: { value: "s" }, 2: { value: "shift" }, 3: { value: "enter" },
      4: { value: "up arrow" }, 5: { value: "down arrow" }, 6: { value: "left arrow" }, 7: { value: "right arrow" },
      8: { value: "z" }, 9: { value: "a" }, 10: { value: "q" }, 11: { value: "w" },
    },
    1: {}, 2: {}, 3: {},
  };

  // On-screen gamepad for phones: DS face buttons, D-pad, SELECT/START and a
  // Cheat button (skips to the next stage) above them. No L/R: the game doesn't need them.
  // Cheat sends RetroPad L3 (14), which the game never reads; we catch it below.
  // The center group is 124px wide and buttons 52px, so x = 36 is centred;
  // Select/Start sit 6px either side of the middle.
  const SKIP_INPUT = 14;
  window.EJS_VirtualGamepadSettings = [
    { type: "button", text: "X", id: "x", location: "right", left: 40, top: 0, bold: true, input_value: 9 },
    { type: "button", text: "Y", id: "y", location: "right", left: 0, top: 40, bold: true, input_value: 1 },
    { type: "button", text: "A", id: "a", location: "right", left: 81, top: 40, bold: true, input_value: 8 },
    { type: "button", text: "B", id: "b", location: "right", left: 40, top: 80, bold: true, input_value: 0 },
    { type: "dpad", location: "left", left: "50%", top: "50%", joystickInput: false, inputValues: [4, 5, 6, 7] },
    { type: "button", text: "Cheat", id: "cheat", location: "center", left: 36, top: -80, fontSize: 15, block: true, input_value: SKIP_INPUT },
    { type: "button", text: "Select", id: "select", location: "center", left: 4, top: -40, fontSize: 15, block: true, input_value: 2 },
    { type: "button", text: "Start", id: "start", location: "center", left: 68, top: -40, fontSize: 15, block: true, input_value: 3 },
  ];
  window.EJS_onGameStart = () => {
    const gm = window.EJS_emulator.gameManager;
    const send = gm.simulateInput.bind(gm);
    gm.simulateInput = (player, index, value) => {
      if (index === SKIP_INPUT) {
        if (value) secretCode();
        return;
      }
      send(player, index, value);
    };
    gm.sendRaw = send;
  };

  // Secret code ↑↑↓↓←→←→BA: in-game it jumps one step ahead (next stage).
  // EmulatorJS RetroPad ids: B=0 UP=4 DOWN=5 LEFT=6 RIGHT=7 A=8
  const CODE = [4, 4, 5, 5, 6, 7, 6, 7, 0, 8];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const btn = document.getElementById("cheat");
  const toast = document.getElementById("toast");
  let busy = false;

  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(say.t);
    say.t = setTimeout(() => toast.classList.remove("show"), 1500);
  }

  async function secretCode() {
    const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
    if (!gm) return say("Start the game first");
    const press = gm.sendRaw || gm.simulateInput.bind(gm);
    if (busy) return;
    busy = true;
    btn.disabled = true;
    for (const k of CODE) {   // each press must last a few frames to register
      press(0, k, 1);
      await sleep(80);
      press(0, k, 0);
      await sleep(80);
    }
    busy = false;
    btn.disabled = false;
    say("Cheat! ↑↑↓↓←→←→BA");
  }

  btn.addEventListener("click", secretCode);

  // iOS home-screen apps with a translucent status bar report a page height
  // that is short of the screen, leaving a gap under the player (and lifting
  // the gamepad). There the app owns the whole screen, so size to the screen.
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
  function fitScreen() {
    if (!standalone) return;
    const portrait = innerHeight >= innerWidth;
    const h = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    document.body.style.height = Math.max(h, innerHeight) + "px";
  }
  addEventListener("resize", fitScreen);

  // tap anywhere on the player to start (the Start button can be hard to hit)
  document.getElementById("game").addEventListener("pointerup", (e) => {
    const start = document.querySelector("#game .ejs_start_button");
    if (start && start.offsetParent && !start.contains(e.target)) start.click();
  });
  addEventListener("orientationchange", () => setTimeout(fitScreen, 300));
  fitScreen();

  // ?debug: show the numbers that decide the layout
  if (location.search.includes("debug")) {
    const box = document.createElement("div");
    box.id = "debug";
    document.body.appendChild(box);
    setInterval(() => {
      const g = document.getElementById("game").getBoundingClientRect();
      const vv = window.visualViewport;
      box.textContent = `standalone ${!!standalone}  inner ${innerWidth}x${innerHeight}\n` +
        `screen ${screen.width}x${screen.height}  visual ${vv ? Math.round(vv.height) : "-"}\n` +
        `body h ${Math.round(document.body.getBoundingClientRect().height)}  game bottom ${Math.round(g.bottom)}`;
    }, 500);
  }

  // Full screen: browsers only allow it from a tap, so phones go full screen
  // on the first touch; the ⛶ button toggles it. (iPhone: Add to Home Screen.)
  const root = document.documentElement;
  const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;
  function enterFull() {
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (!req || isFull()) return;
    Promise.resolve(req.call(root, { navigationUI: "hide" }))
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("portrait").catch(() => {}))
      .catch(() => {});
  }
  document.getElementById("fs").addEventListener("click", () => {
    if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else enterFull();
  });
  if (matchMedia("(pointer: coarse)").matches)
    window.addEventListener("pointerdown", function auto(e) {
      if (e.target.id === "fs") return;   // the ⛶ button handles itself
      window.removeEventListener("pointerdown", auto, true);
      enterFull();
    }, true);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Backquote") {
      e.preventDefault();
      e.stopPropagation();
      secretCode();
    }
  }, true);
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
